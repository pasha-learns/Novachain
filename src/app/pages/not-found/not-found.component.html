<div class="not-found-page">
  <mat-card class="not-found-card" appearance="outlined">
    <mat-card-content>
      <mat-icon class="error-icon">error_outline</mat-icon>
      <p class="error-code">404</p>
      <h1 class="title">Page not found</h1>
      <p class="subtitle">The page you're looking for doesn't exist or has been moved.</p>

      <div class="actions">
        <button mat-flat-button color="primary" class="back-btn" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Go back
        </button>
        <a mat-button routerLink="/" class="home-link">Go to homepage</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
