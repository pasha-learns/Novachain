<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="brand">Novachain</h1>
      <p class="subtitle">Create a new account</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <app-form-field
        [formControl]="form.controls.email"
        label="Email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        [errors]="{ required: 'Email is required', email: 'Enter correct email' }"
      />

      <app-form-field
        [formControl]="form.controls.password"
        label="Password"
        type="password"
        placeholder="Minimum 8 characters"
        autocomplete="new-password"
        [errors]="{ required: 'Password is required', minlength: 'Password must contain at least 8 characters' }"
      />

      <app-form-field
        [formControl]="form.controls.confirmPassword"
        label="Password confirmation"
        type="password"
        placeholder="Repeat the password"
        autocomplete="new-password"
        [errors]="{ required: 'Password confirmation is required', passwordMismatch: 'Passwords do not match' }"
        [groupErrors]="form.errors"
      />

      @if (serverError()) {
        <div class="server-error">{{ serverError() }}</div>
      }

      <button type="submit" class="submit-btn" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
        } @else {
          Register
        }
      </button>
    </form>

    <p class="nav-link">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
