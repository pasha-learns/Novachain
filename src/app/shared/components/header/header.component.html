<header class="header">
  <div class="header-inner">

    <div class="header-left">
      <a routerLink="/" class="logo">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon
            points="15,1.5 27,8.5 27,21.5 15,28.5 3,21.5 3,8.5"
            fill="rgba(59,130,246,0.12)"
            stroke="#3b82f6"
            stroke-width="1.5"
          />
          <circle cx="15" cy="9.5" r="2.8" fill="#60a5fa"/>
          <circle cx="8.5" cy="20.5" r="2.8" fill="#3b82f6"/>
          <circle cx="21.5" cy="20.5" r="2.8" fill="#3b82f6"/>
          <line x1="15" y1="12.3" x2="10" y2="18.2" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="15" y1="12.3" x2="20" y2="18.2" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="11.3" y1="20.5" x2="18.7" y2="20.5" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Novachain</span>
      </a>

      <nav class="nav">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a href="#" class="has-dropdown">Markets <span class="arrow">&#9660;</span></a>
        <a href="#" class="has-dropdown">Trade <span class="arrow">&#9660;</span></a>
        <a href="#" class="has-dropdown">Earn <span class="arrow">&#9660;</span></a>
        <a href="#" class="has-dropdown">More <span class="arrow">&#9660;</span></a>
      </nav>
    </div>

    <div class="header-right">
      <button class="icon-btn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      @if (isAuthenticated()) {
        <button (click)="logout()" class="btn btn-ghost">Log Out</button>
      } @else {
        <a routerLink="/login" class="btn btn-ghost">Log In</a>
        <a routerLink="/register" class="btn btn-primary">Sign Up</a>
      }
    </div>

  </div>
</header>
