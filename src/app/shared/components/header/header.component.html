<header class="header">
  <div class="header-inner">

    <nav class="nav">
      <a routerLink="/" class="logo">
        <app-icon src="/icons/logo.svg" [width]="30" [height]="30" />
        <span class="logo-text">Novachain</span>
      </a>

      @for (item of navItems; track item.label) {
        @if (item.isRoute) {
          <a [routerLink]="item.link" routerLinkActive="active" [class.has-dropdown]="item.hasDropdown ?? false">
            {{ item.label }}
            @if (item.hasDropdown) {
              <span class="arrow">&#9660;</span>
            }
          </a>
        } @else {
          <a href="#" [class.has-dropdown]="item.hasDropdown ?? false">
            {{ item.label }}
            @if (item.hasDropdown) {
              <span class="arrow">&#9660;</span>
            }
          </a>
        }
      }
    </nav>

    <div class="header-right">
      <div class="search-bar" tabindex="-1" [class.is-open]="isSearchOpen()" (keydown.escape)="toggleSearch()" appClickOutside (clickOutside)="isSearchOpen() && toggleSearch()">
        <button
          class="icon-btn search-toggle"
          [attr.aria-label]="isSearchOpen() ? 'Close search' : 'Search'"
          (click)="toggleSearch()">
          @if (isSearchOpen()) {
            <app-icon src="/icons/close.svg" [width]="16" [height]="16" />
          } @else {
            <app-icon src="/icons/search.svg" [width]="18" [height]="18" />
          }
        </button>

        <app-form-field
          class="search-field"
          [formControl]="searchControl"
          placeholder="Search..."
          autocomplete="off"
        />
      </div>

      @if (isAuthenticated()) {
        <button (click)="logout()" class="btn btn-ghost">Log Out</button>
      } @else {
        <a routerLink="/login" class="btn btn-ghost">Log In</a>
        <a routerLink="/register" class="btn btn-primary">Sign Up</a>
      }
    </div>

  </div>
</header>
