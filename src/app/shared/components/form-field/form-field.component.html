<div class="field">
  @if (label()) {
    <label [for]="inputId">{{ label() }}</label>
  }
  <input
    #fieldInput
    [id]="inputId"
    [type]="type()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [formControl]="innerControl"
    [class.invalid]="isInvalid"
    (blur)="onBlur()"
  />
  @if (activeError) {
    <span class="error">{{ activeError }}</span>
  }
</div>
